global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:50080']

  - job_name: 'tempo'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['tempo:3200']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        regex: '(.*)'
        replacement: '${1}'
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'tempo_.*'
        action: keep

  - job_name: 'cucumber-tests'
    static_configs:
      - targets: ['host.docker.internal:9464']  # For Docker on Mac/Windows
