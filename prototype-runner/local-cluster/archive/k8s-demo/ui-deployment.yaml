apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-runner-ui
  namespace: test-runner
spec:
  replicas: 1
  selector:
    matchLabels:
      app: test-runner-ui
  template:
    metadata:
      labels:
        app: test-runner-ui
    spec:
      containers:
        - name: ui
          image: test-runner-ui:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9000
          env:
            - name: VITE_API_BASE
              value: "/api"
---
apiVersion: v1
kind: Service
metadata:
  name: test-runner-ui
  namespace: test-runner
spec:
  selector:
    app: test-runner-ui
  ports:
    - port: 9000
      targetPort: 9000
      protocol: TCP
  type: ClusterIP

