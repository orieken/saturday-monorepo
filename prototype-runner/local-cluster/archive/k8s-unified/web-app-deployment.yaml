apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-app
  namespace: test-runner
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web-app
  template:
    metadata:
      labels:
        app: web-app
    spec:
      containers:
        - name: web-app
          image: web-app:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: API_URL
              value: "http://mock-api:8001"
---
apiVersion: v1
kind: Service
metadata:
  name: web-app
  namespace: test-runner
spec:
  selector:
    app: web-app
  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP
  type: ClusterIP
