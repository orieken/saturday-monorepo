apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-api
  namespace: test-runner
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mock-api
  template:
    metadata:
      labels:
        app: mock-api
    spec:
      containers:
        - name: mock-api
          image: mock-api:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8001
---
apiVersion: v1
kind: Service
metadata:
  name: mock-api
  namespace: test-runner
spec:
  selector:
    app: mock-api
  ports:
    - port: 8001
      targetPort: 8001
      protocol: TCP
  type: ClusterIP
