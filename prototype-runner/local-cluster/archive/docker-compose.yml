version: "3.9"

services:
  backend:
    image: golang:1.25
    working_dir: /app/backend
    command: bash -lc "go run ./cmd/server"
    ports:
      - "8080:8080"
    volumes:
      # Mount the final backend source code (server runs from source)
      - ../backend:/app/backend:rw
      # Mount the tests workspace so the runner can execute CucumberJS + Playwright
      - ../tests:/app/tests:ro
    environment:
      # If your backend needs to resolve tests path differently, adjust handler/runner config accordingly
      - TESTS_DIR=/app/tests
    # Uncomment to persist Go build cache across runs (optional)
    # - go-build-cache:/root/.cache/go-build

  # Optional frontend (disabled by default). Uncomment to run Vite dev server.
  # frontend:
  #   image: node:20
  #   working_dir: /app/frontend
  #   command: bash -lc "npm ci || npm i && npm run dev -- --host"
  #   ports:
  #     - "5173:5173"
  #   environment:
  #     - VITE_API_BASE=http://backend:8080
  #   volumes:
  #     - ../frontend:/app/frontend:rw
  #   depends_on:
  #     - backend

