apiVersion: v1
kind: ServiceAccount
metadata:
  name: test-runner-sa
  namespace: test-runner
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: test-runner-role
  namespace: test-runner
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods", "pods/log", "pods/exec"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: test-runner-rolebinding
  namespace: test-runner
subjects:
  - kind: ServiceAccount
    name: test-runner-sa
    namespace: test-runner
roleRef:
  kind: Role
  name: test-runner-role
  apiGroup: rbac.authorization.k8s.io

