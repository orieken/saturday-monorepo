apiVersion: v1
kind: Service
metadata:
  name: test-runner-ui-nodeport
  namespace: test-runner
spec:
  type: NodePort
  selector:
    app: test-runner-ui
  ports:
    - port: 9000
      targetPort: 9000
      protocol: TCP
      nodePort: 30090
---
apiVersion: v1
kind: Service
metadata:
  name: web-app-nodeport
  namespace: test-runner
spec:
  type: NodePort
  selector:
    app: web-app
  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP
      nodePort: 30080

